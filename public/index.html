<!-- JavaScript Injection to redirect to your exact backend address -->
<script>
const BACKEND_URL = "https://onrender.com"; // Your live scramjet container

function launchProxy(targetUrl) {
if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
targetUrl = 'https://' + targetUrl;
}
// Formats the query explicitly so the Scramjet / Wisp gateway can process it cleanly
window.location.href = BACKEND_URL + "/?url=" + encodeURIComponent(targetUrl);
}

document.getElementById('proxy-form').addEventListener('submit', function(e) {
e.preventDefault();
const inputVal = document.getElementById('proxy-address').value;
if (inputVal) {
launchProxy(inputVal);
}
});
</script>
